{% extends "base.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block heading %}Something went wrong{% endblock %}
{% block content %}
<section class="card error-card">
  <div class="error-code">{{ code }}</div>
  <p>{{ message }}</p>
  <a class="btn" href="{{ url_for('dashboard') }}">Back to dashboard</a>
</section>
{% endblock %}
